{% extends 'catalogo/base.html' %}

{% block title %}Registro de Usuario{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <h2>Crear Cuenta</h2>
    
    {% if error %}
        <p style="color: #721c24; background-color: #f8d7da; padding: 0.5rem; border-radius: 4px;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
            <label for="username">Nombre de Usuario:</label><br>
            <input type="text" id="username" name="username" required style="width: 100%; padding: 0.5rem; margin-top: 0.2rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label for="password">Contraseña:</label><br>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 0.5rem; margin-top: 0.2rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <button type="submit" class="btn" style="width: 100%; cursor: pointer; border: none;">Registrarse</button>
    </form>
    
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>
    </p>
</div>
{% endblock %}
